name: Release to PyPI

# Publish a GitHub release whose tag is the version a release branch such as
# 0.9.x holds, with that branch as the target.  This workflow checks the tag
# against the version, publishes to PyPI, attaches the packages to the
# release, and opens a pull request that bumps the branch to the next patch.
# Run it by hand on a release branch to try a release on TestPyPI; that never
# tags.  See CONTRIBUTING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, do not publish to TestPyPI)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Only a published GitHub release goes to PyPI and bumps the branch.
  RELEASE: ${{ github.event_name == 'release' }}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      branch: ${{ steps.get-version.outputs.branch }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python
      run: uv python install 3.12

    - name: Check the branch and the version
      id: get-version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_TARGET: ${{ github.event.release.target_commitish }}
      run: |
        version=$(.github/scripts/version.sh get)
        if [[ "$RELEASE" == true ]]; then
          branch=$RELEASE_TARGET
          if [[ "$RELEASE_TAG" != "$version" ]]; then
            echo "Release $RELEASE_TAG, but the tagged commit holds version $version."
            echo "Delete the release and its tag.  Then merge the pull request that sets"
            echo "$branch to $RELEASE_TAG and publish again, or publish $version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$branch" 2> /dev/null; then
            echo "Tag $RELEASE_TAG is not on $branch.  Delete the release and its tag,"
            echo "then publish again with a release branch such as 0.9.x as the target."
            exit 1
          fi
        else
          branch=$GITHUB_REF_NAME
        fi
        if [[ ! "$branch" =~ ^([0-9]+\.[0-9]+)\.x$ ]]; then
          echo "Release from a release branch such as 0.9.x, not $branch"
          exit 1
        fi
        if [[ "$version" != "${BASH_REMATCH[1]}".* ]]; then
          echo "$branch holds version $version"
          exit 1
        fi
        echo "Releasing $version from $branch"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "branch=$branch" >> "$GITHUB_OUTPUT"

  security-scan:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Set Python up and add dependencies
      run: |
        uv python install 3.12
        uv sync --all-extras --dev
        uv add --dev bandit

    - name: Run security scan with bandit
      run: |
        uv run bandit -r src/

  test:
    runs-on: ubuntu-latest
    needs: validate-release
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      redis:
        # Pinned to 8.8 so the INCREX rate-limit tier (Redis 8.8+) is exercised
        # in CI; older tags silently fall back to the Lua path.
        image: redis:8.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python ${{ matrix.python-version }}
      run: |
        uv python install ${{ matrix.python-version }}
        uv sync --all-extras --dev

    - name: Run tests
      run: uv run pytest tests/ -v --tb=short
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [validate-release, security-scan, test]
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/fastapi-redis-sdk' || 'https://test.pypi.org/p/fastapi-redis-sdk' }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python
      run: uv python install 3.12

    - name: Build package
      run: |
        uv build --sdist --wheel
        ls "dist/fastapi_redis_sdk-$VERSION-py3-none-any.whl" "dist/fastapi_redis_sdk-$VERSION.tar.gz"

    - name: Check package
      run: |
        uv add --dev twine
        uv run twine check dist/*

    - name: Generate build attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'dist/*'

    - name: Publish to PyPI
      if: ${{ !inputs.dry_run }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ github.event_name != 'release' && 'https://test.pypi.org/legacy/' || '' }}
        print-hash: true
        attestations: true
        # A re-run after a partial upload skips the files PyPI already has.
        skip-existing: true

    - name: Attach the packages to the GitHub release
      if: env.RELEASE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$VERSION" dist/* --clobber

    - name: Dry run - Package ready for publishing
      if: ${{ inputs.dry_run }}
      run: |
        echo "DRY RUN MODE - Package built successfully but not published"
        echo "Built packages:"
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-files
        path: dist/
        retention-days: 90

  bump-patch:
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-publish]
    if: github.event_name == 'release'
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Open the pull request that bumps the branch to the next patch
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ needs.validate-release.outputs.branch }}
        VERSION: ${{ needs.validate-release.outputs.version }}
      run: .github/scripts/version.sh pr "$BRANCH" patch "$VERSION"

  notify-success:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ always() && !cancelled() && needs.build-and-publish.result == 'success' }}
    steps:
    - name: Success notification
      run: |
        if [[ "${{ inputs.dry_run }}" == "true" ]]; then
          echo "DRY RUN COMPLETED - fastapi-redis-sdk ready for release!"
          echo "Package built successfully but not published"
        elif [[ "$RELEASE" == "true" ]]; then
          echo "Successfully released fastapi-redis-sdk!"
          echo "  https://pypi.org/project/fastapi-redis-sdk/"
        else
          echo "Successfully published fastapi-redis-sdk to TestPyPI!"
          echo "  https://test.pypi.org/project/fastapi-redis-sdk/"
        fi
